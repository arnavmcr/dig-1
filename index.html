<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD WAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #080604;
  --cream: #F0E6D3;
  --amber: #C8873A;
  --red: #D42B2B;
  --dust: #0D0B09;
  --grid: #2A2520;
  --muted: #6B5F52;
  --green: #7A9E6B;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0; padding: 0;
  width: 100vw; height: 100vh;
  overflow-x: scroll; overflow-y: hidden;
  white-space: nowrap;
  background-image: url('https://images.unsplash.com/photo-1483412033650-1015ddeb83d1?w=1920&q=80');
  background-size: cover;
  background-position: center;
  scrollbar-width: thin;
  scrollbar-color: var(--amber) transparent;
  font-family: 'IBM Plex Mono', monospace;
}
body::-webkit-scrollbar { height: 4px; }
body::-webkit-scrollbar-thumb { background: var(--amber); border-radius: 2px; }
body::-webkit-scrollbar-track { background: transparent; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at center, transparent 30%, rgba(8,6,4,0.7) 100%),
    rgba(8, 6, 4, 0.82);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 1px,
    rgba(0,0,0,0.03) 1px,
    rgba(0,0,0,0.03) 2px
  );
  pointer-events: none;
  z-index: 0;
}

#floor {
  display: inline-flex;
  flex-direction: row;
  height: 100vh;
  min-width: max-content;
  position: relative;
  z-index: 1;
}

/* ENTRY PANEL */
#entry-panel {
  width: 100vw;
  height: 100vh;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
}
#entry-inner {
  text-align: center;
  position: relative;
  z-index: 2;
}
#entry-grooves {
  position: absolute;
  inset: -200px;
  background: repeating-conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 0.5deg,
    rgba(240,230,211,0.025) 0.5deg,
    rgba(240,230,211,0.025) 1deg
  );
  border-radius: 50%;
  pointer-events: none;
  z-index: -1;
}
#entry-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(72px, 10vw, 120px);
  color: var(--cream);
  letter-spacing: 12px;
  line-height: 1;
  margin: 0;
}
#entry-tagline {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 3px;
  margin-top: 12px;
}
#entry-scroll-hint {
  margin-top: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#scroll-arrow {
  font-size: 24px;
  color: var(--amber);
  animation: pulse-right 1.5s ease-in-out infinite;
}
@keyframes pulse-right {
  0%, 100% { transform: translateX(0); opacity: 0.6; }
  50% { transform: translateX(8px); opacity: 1; }
}
#scroll-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* GENRE SECTION */
.genre-section {
  display: inline-flex;
  flex-direction: row;
  height: 100vh;
  flex-shrink: 0;
}
.genre-divider {
  width: 120px;
  height: 100vh;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 20px 0;
  flex-shrink: 0;
  position: relative;
}
.wax-seal {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--amber);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.seal-letter {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--ink);
}
.genre-name-rotated {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px, 5vw, 72px);
  color: var(--ink);
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  line-height: 1;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: 3px;
}
.genre-stats {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  color: var(--muted);
  text-align: center;
  line-height: 1.8;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.album-grid {
  display: grid;
  grid-template-rows: repeat(3, 1fr);
  grid-auto-flow: column;
  grid-auto-columns: 220px;
  gap: 12px;
  padding: 16px;
  height: 100vh;
  align-content: start;
  box-sizing: border-box;
  overflow: hidden;
}

/* ALBUM CARD */
.album-card {
  width: 196px;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.album-sleeve {
  width: 180px;
  height: 180px;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--grid);
  box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  transition: transform 180ms ease-out, box-shadow 180ms ease-out, border-color 180ms ease-out;
}
.album-card:hover .album-sleeve {
  transform: translateY(-6px);
  box-shadow: 0 12px 32px rgba(0,0,0,0.8);
  border-color: var(--amber);
}
.album-card.selected .album-sleeve {
  border: 2px solid var(--amber);
  box-shadow: 0 0 20px rgba(200,135,58,0.3);
}
.sleeve-art {
  width: 100%; height: 100%;
  position: relative;
}
.sleeve-art svg {
  display: block;
  width: 100%; height: 100%;
}
.sleeve-spine-label {
  position: absolute;
  top: 8px; left: 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  color: rgba(240,230,211,0.85);
  letter-spacing: 1px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  max-width: 100px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sleeve-catalog {
  position: absolute;
  bottom: 6px; right: 8px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: rgba(240,230,211,0.4);
  letter-spacing: 0.5px;
}
.quality-dot {
  position: absolute;
  top: 8px; right: 8px;
  width: 8px; height: 8px;
  border-radius: 50%;
}
.in-bag-stamp {
  position: absolute;
  bottom: 12px; left: -2px;
  background: var(--amber);
  color: var(--ink);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 2px;
  padding: 2px 6px;
  transform: rotate(-8deg);
  display: none;
}
.album-card.selected .in-bag-stamp { display: block; }

.album-meta-strip {
  padding: 6px 0 4px;
  position: relative;
  overflow: hidden;
  width: 180px;
}
.album-title {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.album-artist-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.album-track-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  color: var(--muted);
  margin-top: 2px;
  transition: opacity 180ms;
}
.album-open-label {
  position: absolute;
  bottom: 0; left: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--amber);
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 180ms, transform 180ms;
}
.album-card:hover .album-open-label {
  opacity: 1;
  transform: translateY(0);
}
.album-card:hover .album-track-count {
  opacity: 0;
}

/* ALBUM DETAIL OVERLAY */
#album-overlay {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 420px;
  background: #0D0B09;
  border-top: 1px solid var(--amber);
  z-index: 200;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
}
#album-overlay.open {
  transform: translateY(0);
}
#overlay-inner {
  display: flex;
  flex: 1;
  overflow: hidden;
  padding: 20px;
  gap: 24px;
}
#overlay-left {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
#overlay-art {
  width: 240px;
  height: 240px;
  flex-shrink: 0;
  overflow: hidden;
}
#overlay-art svg {
  display: block;
  width: 100%; height: 100%;
}
#overlay-album-name {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--cream);
  line-height: 1.3;
}
#overlay-artist-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  color: var(--cream);
  letter-spacing: 2px;
}
#overlay-meta-row {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.meta-badge {
  background: var(--grid);
  padding: 2px 6px;
  border-radius: 2px;
  color: var(--cream);
  font-size: 9px;
  letter-spacing: 1px;
}
#overlay-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
}
#overlay-select-controls {
  display: flex;
  gap: 12px;
}
#overlay-select-controls button {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
}
#overlay-select-controls button:hover {
  color: var(--amber);
}
#tracklist {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--grid) transparent;
}
#tracklist::-webkit-scrollbar { width: 3px; }
#tracklist::-webkit-scrollbar-thumb { background: var(--grid); }

.track-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--cream);
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.1s;
}
.track-row:hover { background: rgba(200,135,58,0.08); }
.track-row.track-selected { background: rgba(200,135,58,0.06); }

.track-checkbox {
  width: 14px; height: 14px;
  border: 1px solid var(--muted);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.1s, background 0.1s;
}
.track-row.track-selected .track-checkbox {
  border-color: var(--amber);
  background: var(--amber);
}
.track-checkbox-mark {
  color: var(--ink);
  font-size: 9px;
  display: none;
}
.track-row.track-selected .track-checkbox-mark { display: block; }

.track-num {
  color: var(--muted);
  min-width: 24px;
  text-align: right;
  flex-shrink: 0;
  font-size: 10px;
}
.track-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.track-dur {
  color: var(--muted);
  flex-shrink: 0;
  font-size: 10px;
  min-width: 36px;
  text-align: right;
}
#overlay-bottom {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 8px;
  border-top: 1px solid var(--grid);
  flex-shrink: 0;
  padding: 8px 20px 12px;
}
#add-to-bag-btn {
  flex: 1;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  background: var(--amber);
  color: var(--ink);
  border: none;
  padding: 10px 24px;
  cursor: pointer;
  transition: background 0.15s;
}
#add-to-bag-btn:hover { background: #d9942d; }
#close-overlay-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
}
#close-overlay-btn:hover { color: var(--cream); }

/* SEARCH */
#search-toggle {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 300;
  background: rgba(13,11,9,0.8);
  border: 1px solid var(--grid);
  color: var(--cream);
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: border-color 0.15s;
}
#search-toggle:hover { border-color: var(--amber); }
#search-panel {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 290;
  background: rgba(13,11,9,0.97);
  border-bottom: 1px solid var(--grid);
  transform: translateY(-100%);
  transition: transform 0.25s ease;
  max-height: 100vh;
  display: flex;
  flex-direction: column;
}
#search-panel.open { transform: translateY(0); }
#search-bar-inner {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  border-bottom: 1px solid var(--grid);
}
#search-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px;
  color: var(--cream);
  caret-color: var(--amber);
  letter-spacing: 0.5px;
}
#search-input::placeholder { color: var(--muted); }
#search-close {
  background: transparent; border: none;
  color: var(--muted); font-size: 20px;
  cursor: pointer; padding: 4px 8px;
}
#search-close:hover { color: var(--cream); }
#search-results {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  align-content: start;
  max-height: calc(100vh - 60px);
  scrollbar-width: thin;
  scrollbar-color: var(--grid) transparent;
}
#search-results::-webkit-scrollbar { width: 4px; }
#search-results::-webkit-scrollbar-thumb { background: var(--grid); }

.search-result-card {
  cursor: pointer;
  border: 1px solid var(--grid);
  background: rgba(42,37,32,0.5);
  padding: 8px;
  transition: border-color 0.15s, background 0.15s;
}
.search-result-card:hover {
  border-color: var(--amber);
  background: rgba(42,37,32,0.8);
}
.search-result-art {
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  margin-bottom: 6px;
}
.search-result-art svg { display: block; width: 100%; height: 100%; }
.search-result-title {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--cream);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-result-artist {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.search-result-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 8px;
  color: var(--muted);
  margin-top: 3px;
  opacity: 0.7;
}

/* BAG TRAY */
#bag-tray {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--dust);
  border-top: 1px solid var(--amber);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.6);
  transition: height 0.3s cubic-bezier(0.4,0,0.2,1);
  height: 52px;
  z-index: 100;
  display: flex;
  flex-direction: column;
}
#bag-tray.expanded { height: 40vh; min-height: 240px; }
#bag-header {
  height: 52px; min-height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  cursor: pointer;
  flex-shrink: 0;
  user-select: none;
}
#bag-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  color: var(--cream);
}
#bag-count-badge {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-left: 8px;
  letter-spacing: 1px;
}
#bag-header-left { display: flex; align-items: center; }
#bag-header-right { display: flex; align-items: center; gap: 12px; }
#copy-btn-header {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid var(--muted);
  color: var(--muted);
  background: transparent;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.15s;
}
#copy-btn-header:not(:disabled):hover { border-color: var(--amber); color: var(--amber); }
#copy-btn-header:disabled { opacity: 0.35; cursor: default; }
#bag-expand-icon { color: var(--muted); font-size: 12px; transition: transform 0.3s; }
#bag-tray.expanded #bag-expand-icon { transform: rotate(180deg); }
#bag-body {
  flex: 1; overflow: hidden;
  display: none;
  padding: 0 20px 16px;
  gap: 16px;
}
#bag-tray.expanded #bag-body { display: flex; }
#bag-sleeves {
  display: flex; gap: 8px;
  overflow-x: auto; overflow-y: hidden;
  align-items: flex-start;
  padding-bottom: 4px;
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--grid) transparent;
  max-width: 300px;
}
#bag-sleeves::-webkit-scrollbar { height: 3px; }
#bag-sleeves::-webkit-scrollbar-thumb { background: var(--grid); }
.bag-mini {
  position: relative;
  flex-shrink: 0;
  width: 64px; height: 64px;
  cursor: pointer;
}
.bag-mini-art {
  width: 64px; height: 64px;
  border: 1px solid var(--grid);
  overflow: hidden;
  position: relative;
}
.bag-mini-art svg { display: block; width: 100%; height: 100%; }
.bag-mini-partial {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(200,135,58,0.3) 50%, transparent 50%);
  pointer-events: none;
}
.bag-mini-remove {
  position: absolute;
  top: -5px; right: -5px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 2; font-weight: bold;
  opacity: 0; transition: opacity 0.15s;
}
.bag-mini:hover .bag-mini-remove { opacity: 1; }
#bag-divider { width: 1px; background: var(--grid); flex-shrink: 0; margin: 4px 0; }
#bag-text-area {
  flex: 1; overflow: hidden;
  display: flex; flex-direction: column;
  gap: 10px; min-width: 0;
}
#bag-preview {
  flex: 1; overflow-y: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.6;
  white-space: pre;
  scrollbar-width: thin;
  scrollbar-color: var(--grid) transparent;
}
#bag-preview::-webkit-scrollbar { width: 3px; }
#bag-preview::-webkit-scrollbar-thumb { background: var(--grid); }
#copy-btn-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 3px;
  background: var(--amber);
  color: var(--ink);
  border: none;
  padding: 10px 24px;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  align-self: flex-start;
}
#copy-btn-main:hover { background: #d9942d; transform: translateY(-1px); }
#copy-btn-main.copied { background: var(--green); color: #fff; }

/* END PANEL */
#end-panel {
  width: 60vw;
  height: 100vh;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
#end-inner { text-align: center; }
#end-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  color: var(--muted);
  letter-spacing: 6px;
  margin-bottom: 24px;
}
#dig-again-btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--muted);
  color: var(--muted);
  padding: 8px 20px;
  cursor: pointer;
  transition: all 0.15s;
}

@media (max-width: 767px) {

  .genre-name-rotated { font-size: 40px; }

  #overlay-left { width: 100%; flex-direction: row; align-items: center; gap: 16px; }

    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;

@media (min-width: 768px) {
  #bag-float { display: none; }
}

// ─── UTILITY ───────────────────────────────────────────────────────────────

function strHash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h;
}

function qualityColor(f, br) {
  if (!f) return '#6B5F52';
  f = f.toUpperCase();
  if (f === 'FLAC' || f === 'WAV') return '#C8873A';
  if (f === 'MP3') {
    if (br >= 320000) return '#7A9E6B';
    return '#6B5F52';
  }
  return '#6B5F52';
}

function bitrateLabel(f, br) {
  if (!f) return '';
  f = f.toUpperCase();
  if (f === 'FLAC') return 'FLAC';
  if (f === 'WAV') return 'WAV';
  if (br) return 'MP3 ' + Math.round(br / 1000) + 'k';
  return 'MP3';
}

function fmtDuration(secs) {
  if (secs == null || secs === '' || isNaN(Number(secs))) return '--:--';
  const s = Math.round(Number(secs));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return m + ':' + String(ss).padStart(2, '0');
}

function makeSleeveSVG(artist, album, width, height) {
  const seed = strHash((artist || '') + (album || ''));
  const hue1 = seed % 360;
  const hue2 = (hue1 + 137) % 360;
  const pattern = seed % 4;

  let patternSVG = '';
  if (pattern === 0) {
    let circles = '';
    for (let r = 20; r < Math.max(width, height); r += 15) {
      circles += `<circle cx="${width/2}" cy="${height/2}" r="${r}" fill="none" stroke="rgba(240,230,211,0.3)" stroke-width="0.8"/>`;
    }
    patternSVG = circles;
  } else if (pattern === 1) {
    let lines = '';
    for (let i = -height; i < width + height; i += 12) {
      lines += `<line x1="${i}" y1="0" x2="${i+height}" y2="${height}" stroke="rgba(240,230,211,0.18)" stroke-width="1"/>`;
    }
    patternSVG = lines;
  } else if (pattern === 2) {
    const letter = (artist || '?')[0].toUpperCase();
    patternSVG = `<text x="${width/2}" y="${height*0.65}" text-anchor="middle" font-family="'Bebas Neue',sans-serif" font-size="${Math.min(width,height)*0.85}" fill="rgba(240,230,211,0.13)">${letter}</text>`;
  } else {
    let dots = '';
    for (let x = 15; x < width; x += 20) {
      for (let y = 15; y < height; y += 20) {
        dots += `<circle cx="${x}" cy="${y}" r="2" fill="rgba(240,230,211,0.2)"/>`;
      }
    }
    patternSVG = dots;
  }

  const gradId = 'bg' + (seed % 100000);
  const bg = `<defs>
    <radialGradient id="${gradId}" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="hsl(${hue1},45%,22%)"/>
      <stop offset="100%" stop-color="hsl(${hue2},35%,10%)"/>
    </radialGradient>
  </defs>
  <rect width="${width}" height="${height}" fill="url(#${gradId})"/>`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${bg}${patternSVG}</svg>`;
}

// ─── PREPROCESS ────────────────────────────────────────────────────────────

function preprocessAlbums(data) {
  const albumMap = new Map();

  data.tracks.forEach((track, idx) => {
    const artist = track.ar || 'Unknown';
    const album = track.al || '[Singles]';
    const genre = track.g || 'Other';
    const key = artist + '\0' + album + '\0' + genre;

    if (!albumMap.has(key)) {
      albumMap.set(key, {
        artist,
        album,
        genre,
        year: track.y || null,
        tracks: [],
        bestFormat: null,
        bestBitrate: 0,
        coverSeed: strHash(artist + album)
      });
    }

    const alb = albumMap.get(key);
    alb.tracks.push({ ...track, _idx: idx });

    const f = (track.f || '').toUpperCase();
    const br = track.br || 0;
    if (f === 'FLAC' || f === 'WAV') {
      alb.bestFormat = f;
    } else if (!alb.bestFormat && f === 'MP3') {
      if (br > alb.bestBitrate) {
        alb.bestBitrate = br;
        alb.bestFormat = f;
      }
    }
    if (!alb.year && track.y) alb.year = track.y;
  });

  const genreMap = new Map();
  albumMap.forEach(alb => {
    if (!genreMap.has(alb.genre)) genreMap.set(alb.genre, []);
    genreMap.get(alb.genre).push(alb);
  });

  genreMap.forEach(albums => {
    albums.sort((a, b) => {
      const ac = a.artist.toLowerCase().replace(/^the\s+/, '');
      const bc = b.artist.toLowerCase().replace(/^the\s+/, '');
      if (ac < bc) return -1;
      if (ac > bc) return 1;
      return (a.year || 9999) - (b.year || 9999);
    });
  });

  const orderedGenres = [];
  data.sections.forEach(g => {
    if (genreMap.has(g)) orderedGenres.push({ genre: g, albums: genreMap.get(g) });
  });

  return orderedGenres;
}

// ─── STATE ─────────────────────────────────────────────────────────────────

let selectedTracks = new Set();
let currentOverlayAlbum = null;
let overlayTrackSelections = new Set();
let genreDataMap = new Map();
let allAlbums = [];

// ─── BUILD ALBUM CARD ──────────────────────────────────────────────────────

function createAlbumCard(alb) {
  const card = document.createElement('div');
  card.className = 'album-card';
  card.dataset.albumKey = alb.artist + '\0' + alb.album;

  const sleeve = document.createElement('div');
  sleeve.className = 'album-sleeve';

  const art = document.createElement('div');
  art.className = 'sleeve-art';
  art.innerHTML = makeSleeveSVG(alb.artist, alb.album, 180, 180);

  const spine = document.createElement('div');
  spine.className = 'sleeve-spine-label';
  spine.textContent = alb.artist;

  const catalog = document.createElement('div');
  catalog.className = 'sleeve-catalog';
  catalog.textContent = alb.year || '';

  const qdot = document.createElement('div');
  qdot.className = 'quality-dot';
  qdot.style.background = qualityColor(alb.bestFormat, alb.bestBitrate);

  const stamp = document.createElement('div');
  stamp.className = 'in-bag-stamp';
  stamp.textContent = 'IN BAG';

  art.appendChild(spine);
  art.appendChild(catalog);
  art.appendChild(qdot);
  art.appendChild(stamp);
  sleeve.appendChild(art);

  const meta = document.createElement('div');
  meta.className = 'album-meta-strip';

  const title = document.createElement('div');
  title.className = 'album-title';
  title.textContent = alb.album;

  const artistSub = document.createElement('div');
  artistSub.className = 'album-artist-sub';
  artistSub.textContent = alb.artist;

  const trackCount = document.createElement('div');
  trackCount.className = 'album-track-count';
  trackCount.textContent = alb.tracks.length + ' tracks';

  const openLabel = document.createElement('div');
  openLabel.className = 'album-open-label';
  openLabel.textContent = 'OPEN';

  meta.appendChild(title);
  meta.appendChild(artistSub);
  meta.appendChild(trackCount);
  meta.appendChild(openLabel);

  card.appendChild(sleeve);
  card.appendChild(meta);

  card.addEventListener('click', () => openOverlay(alb, card));

  return card;
}

// ─── BUILD ALBUM GRID ──────────────────────────────────────────────────────

function buildAlbumGrid(gridEl, albums) {
  albums.forEach(alb => {
    const card = createAlbumCard(alb);
    gridEl.appendChild(card);
  });
}

// ─── BUILD FLOOR ───────────────────────────────────────────────────────────

function buildFloor(genreGroups) {
  const floor = document.getElementById('floor');
  const endPanel = document.getElementById('end-panel');

  genreGroups.forEach((gg, idx) => {
    genreDataMap.set(gg.genre, gg);
    gg.albums.forEach(a => allAlbums.push(a));

    const section = document.createElement('div');
    section.className = 'genre-section';
    section.dataset.genre = gg.genre;

    const totalTracks = gg.albums.reduce((s, a) => s + a.tracks.length, 0);

    // Divider
    const divider = document.createElement('div');
    divider.className = 'genre-divider';
    divider.innerHTML = `
      <div class="wax-seal"><span class="seal-letter">${gg.genre[0].toUpperCase()}</span></div>
      <div class="genre-name-rotated">${gg.genre}</div>
      <div class="genre-stats">
        <span class="genre-stat-albums">${gg.albums.length} albums</span><br>
        <span class="genre-stat-tracks">${totalTracks} tracks</span>
      </div>
    `;

    const grid = document.createElement('div');
    grid.className = 'album-grid';
    grid.dataset.genre = gg.genre;

    section.appendChild(divider);
    section.appendChild(grid);

    floor.insertBefore(section, endPanel);

    // First 2 sections render immediately
    if (idx < 2) {
      section.dataset.loaded = 'true';
      buildAlbumGrid(grid, gg.albums);
    } else {
      sectionObserver.observe(section);
    }
  });
}

// ─── INTERSECTION OBSERVER ─────────────────────────────────────────────────

const sectionObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const section = entry.target;
    if (entry.isIntersecting && !section.dataset.loaded) {
      section.dataset.loaded = 'true';
      const genreName = section.dataset.genre;
      const genreData = genreDataMap.get(genreName);
      if (genreData) buildAlbumGrid(section.querySelector('.album-grid'), genreData.albums);
    }
  });
}, {
  root: null,
  rootMargin: '0px 500px 0px 500px',
  threshold: 0
});

// ─── OVERLAY ───────────────────────────────────────────────────────────────

function openOverlay(alb, cardEl) {
  currentOverlayAlbum = alb;
  overlayTrackSelections = new Set();

  // Pre-populate from already selected tracks
  alb.tracks.forEach(t => {
    if (selectedTracks.has(t._idx)) overlayTrackSelections.add(t._idx);
  });

  // Art
  const overlayArt = document.getElementById('overlay-art');
  overlayArt.innerHTML = makeSleeveSVG(alb.artist, alb.album, 240, 240);

  document.getElementById('overlay-album-name').textContent = alb.album;
  document.getElementById('overlay-artist-name').textContent = alb.artist;

  const metaRow = document.getElementById('overlay-meta-row');
  const fmtLabel = bitrateLabel(alb.bestFormat, alb.bestBitrate);
  const qColor = qualityColor(alb.bestFormat, alb.bestBitrate);
  metaRow.innerHTML = '';
  if (alb.year) {
    const b = document.createElement('span');
    b.className = 'meta-badge';
    b.textContent = alb.year;
    metaRow.appendChild(b);
  }
  if (fmtLabel) {
    const b = document.createElement('span');
    b.className = 'meta-badge';
    b.style.color = qColor;
    b.textContent = fmtLabel;
    metaRow.appendChild(b);
  }
  const b3 = document.createElement('span');
  b3.className = 'meta-badge';
  b3.textContent = alb.genre;
  metaRow.appendChild(b3);
  const b4 = document.createElement('span');
  b4.className = 'meta-badge';
  b4.textContent = alb.tracks.length + ' tracks';
  metaRow.appendChild(b4);

  renderTracklist();

  const overlay = document.getElementById('album-overlay');
  overlay.classList.add('open');
}

function renderTracklist() {
  const tracklist = document.getElementById('tracklist');
  tracklist.innerHTML = '';
  const alb = currentOverlayAlbum;
  if (!alb) return;

  alb.tracks.forEach((track, i) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    if (overlayTrackSelections.has(track._idx)) row.classList.add('track-selected');

    const checkbox = document.createElement('div');
    checkbox.className = 'track-checkbox';
    const mark = document.createElement('span');
    mark.className = 'track-checkbox-mark';
    mark.textContent = '✓';
    checkbox.appendChild(mark);

    const num = document.createElement('div');
    num.className = 'track-num';
    num.textContent = String(i + 1).padStart(2, '0');

    const name = document.createElement('div');
    name.className = 'track-name';
    name.textContent = track.n || 'Unknown Track';

    const dur = document.createElement('div');
    dur.className = 'track-dur';
    dur.textContent = fmtDuration(track.d);

    row.appendChild(checkbox);
    row.appendChild(num);
    row.appendChild(name);
    row.appendChild(dur);

    row.addEventListener('click', () => {
      const idx = track._idx;
      if (overlayTrackSelections.has(idx)) {
        overlayTrackSelections.delete(idx);
        row.classList.remove('track-selected');
      } else {
        overlayTrackSelections.add(idx);
        row.classList.add('track-selected');
      }
    });

    tracklist.appendChild(row);
  });
}

function closeOverlay() {
  document.getElementById('album-overlay').classList.remove('open');
  currentOverlayAlbum = null;
}

document.getElementById('close-overlay-btn').addEventListener('click', closeOverlay);

document.getElementById('select-all-btn').addEventListener('click', () => {
  if (!currentOverlayAlbum) return;
  currentOverlayAlbum.tracks.forEach(t => overlayTrackSelections.add(t._idx));
  renderTracklist();
});

document.getElementById('deselect-all-btn').addEventListener('click', () => {
  overlayTrackSelections.clear();
  renderTracklist();
});

document.getElementById('add-to-bag-btn').addEventListener('click', () => {
  overlayTrackSelections.forEach(idx => selectedTracks.add(idx));
  updateBag();
  updateAlbumCardStates();
  closeOverlay();
});

// ─── BAG ───────────────────────────────────────────────────────────────────

function buildClipboardText() {
  // Group selected track indices by album
  const albumGroups = new Map();
  selectedTracks.forEach(idx => {
    const track = DATA.tracks[idx];
    if (!track) return;
    const artist = track.ar || 'Unknown';
    const album = track.al || '[Singles]';
    const genre = track.g || 'Other';
    const key = artist + '\0' + album + '\0' + genre;
    if (!albumGroups.has(key)) albumGroups.set(key, { artist, album, genre, year: track.y, tracks: [] });
    albumGroups.get(key).tracks.push({ idx, track });
  });

  let lines = ['── DEAD WAX ────────────────────────────────', ''];

  albumGroups.forEach(({ artist, album, genre, year, tracks }) => {
    const fmtLabel = (() => {
      let best = null, bestBr = 0;
      tracks.forEach(({ track: t }) => {
        const f = (t.f || '').toUpperCase();
        const br = t.br || 0;
        if (f === 'FLAC' || f === 'WAV') best = f;
        else if (!best && f === 'MP3' && br > bestBr) { best = f; bestBr = br; }
      });
      return bitrateLabel(best, bestBr);
    })();

    lines.push(`${artist} — ${album}${year ? ' (' + year + ')' : ''}`);
    lines.push(`Genre: ${genre}${fmtLabel ? '  |  Format: ' + fmtLabel : ''}`);
    lines.push('Tracks:');
    tracks.forEach(({ track: t }, i) => {
      lines.push(`${String(i+1).padStart(2,'0')}. ${t.n || 'Unknown'} (${fmtDuration(t.d)})`);
    });
    lines.push('');
  });

  lines.push('────────────────────────────────────────────');
  lines.push('a record collection worth digging');

  return lines.join('\n');
}

function updateBag() {
  const count = selectedTracks.size;
  document.getElementById('bag-count-badge').textContent = count + ' track' + (count !== 1 ? 's' : '');
  const copyBtnHeader = document.getElementById('copy-btn-header');
  copyBtnHeader.disabled = count === 0;

  // Build mini sleeves
  const sleevesEl = document.getElementById('bag-sleeves');
  sleevesEl.innerHTML = '';

  // Group by album
  const albumGroups = new Map();
  selectedTracks.forEach(idx => {
    const track = DATA.tracks[idx];
    if (!track) return;
    const artist = track.ar || 'Unknown';
    const album = track.al || '[Singles]';
    const key = artist + '\0' + album;
    if (!albumGroups.has(key)) {
      const albObj = allAlbums.find(a => a.artist === artist && a.album === album);
      albumGroups.set(key, { artist, album, albObj, selectedCount: 0, totalCount: albObj ? albObj.tracks.length : 0 });
    }
    albumGroups.get(key).selectedCount++;
  });

  albumGroups.forEach(({ artist, album, albObj, selectedCount, totalCount }, key) => {
    const mini = document.createElement('div');
    mini.className = 'bag-mini';

    const art = document.createElement('div');
    art.className = 'bag-mini-art';
    art.innerHTML = makeSleeveSVG(artist, album, 64, 64);

    if (selectedCount < totalCount && totalCount > 0) {
      const partial = document.createElement('div');
      partial.className = 'bag-mini-partial';
      art.appendChild(partial);
    }

    const removeBtn = document.createElement('div');
    removeBtn.className = 'bag-mini-remove';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      // Remove all tracks for this album
      if (albObj) {
        albObj.tracks.forEach(t => selectedTracks.delete(t._idx));
      } else {
        // fallback: remove by matching
        selectedTracks.forEach(idx => {
          const t = DATA.tracks[idx];
          if (t && (t.ar || 'Unknown') === artist && (t.al || '[Singles]') === album) {
            selectedTracks.delete(idx);
          }
        });
      }
      updateBag();
      updateAlbumCardStates();
    });

    mini.appendChild(art);
    mini.appendChild(removeBtn);
    sleevesEl.appendChild(mini);
  });

  // Preview text
  if (count > 0) {
    document.getElementById('bag-preview').textContent = buildClipboardText();
  } else {
    document.getElementById('bag-preview').textContent = '';
  }

  // Mobile float
  const floatCount = document.getElementById('bag-float-count');
  if (floatCount) floatCount.textContent = count;
}

function doCopy() {
  const text = buildClipboardText();
  navigator.clipboard.writeText(text).then(() => {
    [document.getElementById('copy-btn-main'), document.getElementById('copy-btn-header')].forEach(btn => {
      if (!btn) return;
      const orig = btn.textContent;
      btn.classList.add('copied');
      btn.textContent = 'COPIED!';
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = orig;
      }, 1800);
    });
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

document.getElementById('copy-btn-main').addEventListener('click', doCopy);
document.getElementById('copy-btn-header').addEventListener('click', doCopy);

document.getElementById('bag-header').addEventListener('click', () => {
  document.getElementById('bag-tray').classList.toggle('expanded');
});

// ─── ALBUM CARD STATE UPDATE ───────────────────────────────────────────────

function updateAlbumCardStates() {
  document.querySelectorAll('.album-card').forEach(card => {
    const key = card.dataset.albumKey;
    if (!key) return;
    const [artist, album] = key.split('\0');
    const albObj = allAlbums.find(a => a.artist === artist && a.album === album);
    if (!albObj) return;
    const hasSelected = albObj.tracks.some(t => selectedTracks.has(t._idx));
    card.classList.toggle('selected', hasSelected);
  });
}

// ─── SEARCH ────────────────────────────────────────────────────────────────

let searchTimer = null;

document.getElementById('search-toggle').addEventListener('click', () => {
  document.getElementById('search-panel').classList.add('open');
  document.getElementById('search-input').focus();
});

function closeSearch() {
  document.getElementById('search-panel').classList.remove('open');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
}

document.getElementById('search-close').addEventListener('click', closeSearch);

document.getElementById('search-input').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(e.target.value.trim()), 180);
});

function doSearch(q) {
  const resultsEl = document.getElementById('search-results');
  resultsEl.innerHTML = '';
  if (!q || q.length < 2) return;

  const ql = q.toLowerCase();
  const matched = allAlbums.filter(alb => {
    if (alb.artist.toLowerCase().includes(ql)) return true;
    if (alb.album.toLowerCase().includes(ql)) return true;
    if (alb.genre.toLowerCase().includes(ql)) return true;
    if (alb.tracks.some(t => (t.n || '').toLowerCase().includes(ql))) return true;
    return false;
  }).slice(0, 80);

  matched.forEach(alb => {
    const card = document.createElement('div');
    card.className = 'search-result-card';

    const artEl = document.createElement('div');
    artEl.className = 'search-result-art';
    artEl.innerHTML = makeSleeveSVG(alb.artist, alb.album, 180, 180);

    const titleEl = document.createElement('div');
    titleEl.className = 'search-result-title';
    titleEl.textContent = alb.album;

    const artistEl = document.createElement('div');
    artistEl.className = 'search-result-artist';
    artistEl.textContent = alb.artist;

    const metaEl = document.createElement('div');
    metaEl.className = 'search-result-meta';
    metaEl.textContent = [alb.genre, alb.year, alb.tracks.length + ' trk'].filter(Boolean).join(' · ');

    card.appendChild(artEl);
    card.appendChild(titleEl);
    card.appendChild(artistEl);
    card.appendChild(metaEl);

    card.addEventListener('click', () => {
      closeSearch();
      openOverlay(alb, null);
    });

    resultsEl.appendChild(card);
  });

  if (matched.length === 0) {
    resultsEl.innerHTML = '<div style="grid-column:1/-1;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--muted);padding:20px;">no results found</div>';
  }
}

// ─── WHEEL SCROLL ──────────────────────────────────────────────────────────

document.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    document.documentElement.scrollLeft += e.deltaY * 1.5;
  }
}, { passive: false });

// ─── KEYBOARD ──────────────────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('search-panel').classList.contains('open')) {
      closeSearch();
    } else if (document.getElementById('album-overlay').classList.contains('open')) {
      closeOverlay();
    }
  }
});

// ─── DIG AGAIN ─────────────────────────────────────────────────────────────

document.getElementById('dig-again-btn').addEventListener('click', () => {
  document.documentElement.scrollLeft = 0;
  document.body.scrollLeft = 0;
});

// ─── INIT ──────────────────────────────────────────────────────────────────

(function init() {
  const genreGroups = preprocessAlbums(DATA);
  buildFloor(genreGroups);
  updateBag();
})();
</script>
